<script>
    // ============================================================
    // YOUR GOOGLE APPS SCRIPT URL
    // ============================================================
    const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4A2o5p1FymFgrOOrnIb2MjvsmmRBKWr5yyccOQoo5ZhtaZly4ZxXK3ka6LRwOHH7ntg/exec";

    // Set current date
    function setCurrentDate() {
        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const now = new Date();
        document.getElementById('currentDate').textContent = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
    }
    setCurrentDate();

    // Generate weekly forecast
    function generateWeeklyForecast(currentTemp) {
        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const icons = ['☀️', '⛅', '🌧️', '☁️', '🌤️', '🌦️'];
        const today = new Date().getDay();
        const forecast = [];
        for (let i = 0; i < 7; i++) {
            const dayIndex = (today + i) % 7;
            let change = i === 0 ? 0 : (Math.random() * 6) - 2;
            forecast.push({ day: days[dayIndex], temp: Math.round(currentTemp + change), icon: icons[i % icons.length] });
        }
        return forecast;
    }

    function renderForecast(forecast) {
        const container = document.getElementById('forecastContainer');
        if (!container) return;
        container.innerHTML = forecast.map(day => `<div class="forecast-card"><div class="forecast-day">${day.day.substring(0, 3)}</div><div class="forecast-icon">${day.icon}</div><div class="forecast-temp">${day.temp}°</div></div>`).join('');
    }

    // Fetch live data from Apps Script
    async function fetchLiveData() {
        const statusHint = document.getElementById('refreshHint');
        statusHint.innerHTML = "Loading...";
        
        try {
            // ✅ FIX 1: Added cache-buster
            const response = await fetch(APP_SCRIPT_URL + "?t=" + new Date().getTime());
            const result = await response.json();
            
            if (result.status === 'success' && result.data && result.data.length > 0) {
                
                // ✅ FIX 2: Get latest row instead of first row
                const d = result.data[result.data.length - 1];
                
                const temp = parseFloat(d[1]) || 0;
                const humidity = parseFloat(d[2]) || 0;
                const pressure = parseFloat(d[3]) || 0;
                const windSpeed = parseFloat(d[4]) || 0;
                const rain = parseFloat(d[5]) || 0;
                const co = parseFloat(d[6]) || 0;
                const no2 = parseFloat(d[7]) || 0;
                const pm25 = parseFloat(d[10]) || 0;
                const pm10 = parseFloat(d[11]) || 0;
                const aqi = parseFloat(d[12]) || 0;
                const dayHigh = parseFloat(d[13]) || 0;
                const nightLow = parseFloat(d[14]) || 0;
                const feelsLike = parseFloat(d[15]) || 0;
                const moonIllum = parseFloat(d[19]) || 0;
                
                document.getElementById('mainTemp').textContent = temp;
                document.getElementById('weatherCondition').textContent = "Live Data";
                document.getElementById('dayHigh').textContent = dayHigh;
                document.getElementById('nightLow').textContent = nightLow;
                document.getElementById('feelsLike').textContent = feelsLike;
                
                document.getElementById('humidityVal').innerHTML = humidity + '<span class="unit-sm">%</span>';
                document.getElementById('pressureVal').innerHTML = pressure + '<span class="unit-sm"> mb</span>';
                document.getElementById('windInfo').innerHTML = windSpeed + '<span class="unit-sm"> km/h</span>';
                document.getElementById('rainVal').innerHTML = rain.toFixed(1) + '<span class="unit-sm"> mm/h</span>';
                document.getElementById('coVal').innerHTML = co.toFixed(2) + '<span class="unit-sm"> ppm</span>';
                document.getElementById('no2Val').innerHTML = no2.toFixed(1) + '<span class="unit-sm"> ppb</span>';
                document.getElementById('pm25val').innerHTML = pm25 + '<span class="unit-sm"> µg/m³</span>';
                document.getElementById('pm25valSide').textContent = pm25;
                document.getElementById('pm10valSide').textContent = pm10;
                document.getElementById('aqiValue').textContent = aqi;
                document.getElementById('aqiValueLarge').textContent = aqi;
                
                let aqiLevel = "Good";
                if (aqi > 50 && aqi <= 100) aqiLevel = "Satisfactory";
                else if (aqi > 100 && aqi <= 200) aqiLevel = "Moderate";
                else if (aqi > 200 && aqi <= 300) aqiLevel = "Poor";
                else if (aqi > 300) aqiLevel = "Severe";
                document.getElementById('aqiLevel').textContent = aqiLevel;
                document.getElementById('aqiDesc').textContent = "Real-time air quality from your weather station";
                
                document.getElementById('moonPhaseName').textContent = moonIllum > 50 ? "Waxing Gibbous" : "Waning Crescent";
                document.getElementById('moonIllum').textContent = Math.round(moonIllum);
                
                document.getElementById('sunriseTime').textContent = d[17] || "06:00";
                document.getElementById('sunsetTime').textContent = d[18] || "18:00";
                
                document.getElementById('pollenInfo').innerHTML = '<i class="fas fa-seedling"></i> Pollen levels are normal in your area';
                
                renderForecast(generateWeeklyForecast(temp));
                
                document.getElementById('updateTimestamp').innerHTML = `Last update: ${new Date().toLocaleString()}`;
                statusHint.innerHTML = "Live ✅";
                
            } else {
                statusHint.innerHTML = "No Data";
            }
        } catch (error) {
            console.error("Fetch error:", error);
            statusHint.innerHTML = "Error";
        }
    }

    document.getElementById('refreshBtn').addEventListener('click', () => {
        fetchLiveData();
    });

    fetchLiveData();
    setInterval(fetchLiveData, 60000);
</script>
